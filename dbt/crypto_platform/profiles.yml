###############################################################################
# dbt connection profiles for BigQuery.
#
# SECURITY: This file is committed to version control because it contains
# NO credentials — authentication is handled by ADC (Application Default
# Credentials) locally and by sa-dbt Workload Identity in CI/CD.
#
# Local usage:
#   gcloud auth application-default login
#   dbt run --profiles-dir .
#
# CI/CD usage:
#   GitHub Actions authenticates via WIF → sa-dbt service account.
#   The google-github-actions/auth step sets GOOGLE_APPLICATION_CREDENTIALS.
#
# Profile selection:
#   DBT_TARGET env var controls dev vs prod target.
#   Default: dev (lower query cost — uses dataset partitions aggressively).
###############################################################################

crypto_platform:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"

  outputs:

    # Local development — OrbStack DuckDB
    dev:
      type: duckdb
      path: /data/duckdb/crypto_platform.db
      schema: dbt_dev
      threads: 4

    # Production — MotherDuck Cloud
    prod:
      type: duckdb
      path: "md:crypto_platform?motherduck_token={{ env_var('MOTHERDUCK_TOKEN') }}"
      schema: gold_analytics
      threads: 8
      settings:
        # MotherDuck performance optimizations
        memory_limit: '2GB'
        threads: 8