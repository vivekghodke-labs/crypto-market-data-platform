###############################################################################
# Local development stack for Apple Silicon Mac (OrbStack).
#
# Services:
#   pubsub-emulator  — Google Cloud Pub/Sub emulator (no GCP credentials needed)
#   pubsub-init      — One-shot container that creates topics + subscriptions
#                      on the emulator before the ingestor starts
#   ingestor         — The ingestor service pointed at the local emulator
#
# Usage:
#   make run           → Start the full local stack
#   make stop          → Tear down all containers and volumes
#   make logs          → Tail all container logs
#
# Note on platform:
#   google/cloud-sdk is multi-arch and runs natively on arm64 (M2).
#   The ingestor image is built linux/amd64 to match Cloud Run. OrbStack
#   handles amd64 emulation transparently on Apple Silicon with near-native
#   performance via Rosetta 2.
###############################################################################

services:

  # ─── PostgreSQL (Airflow Metadata) ───────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    platform: linux/amd64
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform-net
    restart: unless-stopped


  # ─── Ingestor Service ───────────────────────────────────────────────────────
  # Points to Redpanda Cloud instead of a local emulator.
  ingestor:
    build:
      context: ./services/ingestor
      dockerfile: Dockerfile
      platforms: 
        - linux/amd64
    platform: linux/amd64
    env_file:
      - .env.local
    environment:
      KAFKA_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_SASL_MECHANISM: SCRAM-SHA-256
      KAFKA_TOPIC_RAW_TRADES: btc-raw-trades
      KAFKA_TOPIC_DEAD_LETTER: btc-dead-letter

      # Binance
      BINANCE_WS_URL: ${BINANCE_WS_URL:-wss://stream.binance.com:9443/ws/btcusdt@trade}

      # App config
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      # DuckDB storage (shared with Beam)
      - duckdb-data:/data/duckdb
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - platform-net
    restart: on-failure:3

volumes:
  postgres-data:
    driver: local
  duckdb-data:
    driver: local

networks:
  platform-net:
    driver: bridge