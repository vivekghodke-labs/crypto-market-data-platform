# Triggers only on push to main (PR merge).
# Calls Render deploy hook — Render pulls latest main, rebuilds, and deploys.
#
# Required GitHub Secret (repo Settings → Secrets → Actions):
#   RENDER_DEPLOY_HOOK_URL  — from Render dashboard:
#                             Service → Settings → Deploy Hook → Copy URL

name: CD

on:
  workflow_run:
    workflows: ["CI"] # Replace with exact name string of your CI workflow
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy → Render
    runs-on: ubuntu-latest
    # Only deploy if CI actually passed
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Trigger Render deploy hook
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ]; then
            echo "Deploy hook failed: ${HTTP_STATUS}"
            exit 1
          fi
          echo "Deploy triggered successfully."