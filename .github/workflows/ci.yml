# Runs on every PR targeting main AND every push to dev/feature branches.
# Never deploys — deploy is cd.yml (main merge only).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]   # feature/* and dev branches — build + test only

env:
  PYTHON_VERSION: "3.12"

jobs:

  test:
    name: Unit Tests — Ingestor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingestor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/ingestor/requirements-dev.txt

      - name: Install deps
        run: pip install -r requirements-dev.txt

      - name: pytest
        run: |
          pytest tests/ \
            --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80 \
            -v

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-ingestor
          path: services/ingestor/coverage.xml
          retention-days: 7

  lint:
    name: Lint — ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingestor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.8.2
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  docker:
    name: Docker Build — validate only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v5
        with:
          context: services/ingestor
          file: services/ingestor/Dockerfile
          platforms: linux/amd64
          push: false
          tags: crypto-ingestor:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-beam:
    name: Unit Tests — Beam
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beam
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: beam/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: pytest
        run: |
          pytest tests/ \
            --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80 \
            -v

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-beam
          path: beam/coverage.xml
          retention-days: 7

  dbt-compile:
    name: dbt Compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt/crypto_platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install -r requirements.txt

      - run: dbt deps --profiles-dir .

      - name: dbt compile
        env:
          DBT_TARGET: dev
        run: dbt compile --profiles-dir . --target dev --no-populate-cache

      - name: Validate custom test SQL files
        run: |
          for f in tests/assert_*.sql; do
            if [ ! -s "$f" ]; then
              echo "ERROR: $f is empty or missing"
              exit 1
            fi
            echo "OK: $f"
          done